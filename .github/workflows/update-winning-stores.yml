name: Update lotto winning stores

on:
  push:
    paths:
      - ".github/workflows/update-winning-stores.yml"
  schedule:
    - cron: "0 18 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update winning stores
        run: node lotto-app/scripts/update-winning-stores.mjs
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lotto-app/winning-stores.js
          git diff --cached --quiet || git commit -m "chore: update winning store data"
          git push
