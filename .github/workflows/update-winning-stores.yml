name: Update lotto winning stores

on:
  push:
    paths:
      - ".github/workflows/update-winning-stores.yml"
  schedule:
    - cron: "0 12 * * 6" # Saturday 21:00 Korea time (draw results)
    - cron: "0 18 * * 6" # Sunday 03:00 Korea time
    - cron: "0 23 * * 6" # Sunday 08:00 Korea time
    - cron: "0 5 * * 0"  # Sunday 14:00 Korea time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update winning stores
        run: node lotto-app/scripts/update-winning-stores.mjs
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lotto-app/winning-stores.js
          git diff --cached --quiet || git commit -m "chore: update winning store data"
          git push
