function matches(numbers,prior){const set=new Set(numbers.map(Number));return draws.filter(r=>!prior||+r.회차<+prior).map(r=>{const h=[1,2,3,4,5,6].filter(i=>set.has(+r['번호'+i])).length,b=set.has(+r.보너스);const rank=h===6?'1등':h===5&&b?'2등':h===5?'3등':h===4?'4등':h===3?'5등':'';return rank?{r,rank}:null}).filter(Boolean)}function table(ms,title,note,list){const c=[1,2,3,4,5].map(x=>ms.filter(m=>m.rank===x+'등').length);return `<p class="compare-title">${title}</p><p class="note">${note}</p><table class="compare"><tr><th>등수</th><th>일치 조건</th><th>나온 횟수</th></tr>${[['1등','6개'],['2등','5개 + 보너스'],['3등','5개'],['4등','4개'],['5등','3개']].map((x,i)=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${c[i]}회</td></tr>`).join('')}<tr><td>전체</td><td>3개 이상 일치</td><td>${ms.length}회</td></tr></table>${list?`<div class="matches"><p class="compare-title">일치 당첨회차 · 당첨번호</p>${ms.slice().reverse().map(m=>`<div class="match"><div class="match-head"><span><b class="match-rank">${m.rank}</b> · 제 ${m.r.회차}회</span><span>${m.r.추첨일}</span></div>${balls(m.r)}</div>`).join('')}</div>`:''}`}
function goRound(round){const target=draws.find(row=>+row.회차===+round);if(target)openDrawDetail(target,window.scrollY)}function drawNavigator(r){const index=draws.findIndex(row=>+row.회차===+r.회차),previous=draws[index-1],next=draws[index+1];return `<div class="round-nav"><button class="round-jump" ${previous?`onclick="goRound(${previous.회차})"`:''} ${previous?'':'disabled'} aria-label="이전 회차">‹</button><span>제 ${r.회차}회</span><button class="round-jump" ${next?`onclick="goRound(${next.회차})"`:''} ${next?'':'disabled'} aria-label="다음 회차">›</button></div>`}
function openDrawDetail(r){$('#drawDetailContent').innerHTML=`${drawNavigator(r)}<h1>제 ${r.회차}회 당첨결과</h1><p class="subtitle">${r.추첨일} 추첨</p><div class="detail-hero"><div class="label">당첨번호</div><div class="detail-date">보너스 번호를 포함한 추첨 결과입니다.</div>${balls(r)}</div><h2>등수별 당첨 결과</h2><div class="prizes">${[1,2,3,4,5].map(n=>`<div class="prize"><span class="rank">${n}등</span><div><div class="label">${['6개 일치','5개 + 보너스','5개 일치','4개 일치','3개 일치'][n-1]}</div><b>${Number(r[n+'등당첨자수']).toLocaleString()}명</b></div><div class="amount"><div class="label">1인당 당첨금</div>${money(r[n+'등1인당당첨금'])}</div></div>`).join('')}</div><div class="detail-compare">${table(matches([1,2,3,4,5,6].map(i=>r['번호'+i]),r.회차),'과거 회차 번호 일치 기록',`제 ${r.회차}회 번호를 이전 ${+r.회차-1}개 회차와 비교한 결과입니다.`,true)}</div>`;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='drawDetail'));document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view==='history'));window.scrollTo(0,0)}
function history(){const q=$('#search').value.trim(),rows=draws.slice().reverse().filter(r=>!q||String(r.회차).includes(q));$('#count').textContent=`총 ${rows.length.toLocaleString()}개 회차 · 회차를 누르면 상세 결과가 열립니다.`;$('#historyList').innerHTML=rows.map(r=>`<button class="history" data-round="${r.회차}"><div class="history-head"><span>제 ${r.회차}회</span><span><span class="history-date">${r.추첨일}</span> <b class="chev">›</b></span></div>${balls(r)}</button>`).join('')||'<p class="subtitle">일치하는 회차가 없습니다.</p>'}
function manual(){const p=$('#preview');p.innerHTML=Array.from({length:6},(_,i)=>selected[i]?`<span class="ball marked-preview">${selected[i]}</span>`:'<span class="ball"></span>').join('');$('#selectedCount').textContent=`${selected.length} / 6`;$('#selector').innerHTML=Array.from({length:49},(_,i)=>{const n=i+1;return n<=45?`<button class="pick ${selected.includes(n)?'selected':''}" data-no="${n}"><span>${n}</span></button>`:'<span class="pick empty"></span>'}).join('');$('#save').disabled=selected.length!==6;$('#save').textContent=selected.length===6?'조합 저장':`${6-selected.length}개 더 선택`}
function aiAutoPick(){const sample=draws.slice(-104),frequency=Array(46).fill(0),lastSeen=Array(46).fill(-1);sample.forEach((row,index)=>[1,2,3,4,5,6].forEach(i=>{const n=+row['번호'+i];frequency[n]++;lastSeen[n]=index}));const max=Math.max(...frequency),picked=[];while(picked.length<6){const candidates=Array.from({length:45},(_,i)=>i+1).filter(n=>!picked.includes(n));const weights=candidates.map(n=>{const frequent=frequency[n]/max,overdue=(sample.length-1-lastSeen[n])/sample.length;return .45+.65*frequent+.35*overdue+Math.random()*.4});let cursor=Math.random()*weights.reduce((a,b)=>a+b,0),choice=candidates.at(-1);for(let i=0;i<candidates.length;i++){cursor-=weights[i];if(cursor<=0){choice=candidates[i];break}}picked.push(choice)}selected=picked.sort((a,b)=>a-b);selectionMode='ai';manual();toast('최근 104회 출현 흐름을 분석해 조합했어요.')}
function ticket(nums){const set=new Set(nums.map(Number));return `<div class="mini-ticket"><p class="ticket-title">내가 마킹한 번호</p><div class="ticket-grid">${Array.from({length:49},(_,i)=>{const n=i+1;return n<=45?`<span class="ticket-cell ${set.has(n)?'marked':''}">${n}</span>`:'<span class="ticket-cell blank"></span>'}).join('')}</div></div>`}function renderEditTicket(index){const box=document.querySelector(`.editable-ticket[data-index="${index}"]`);if(!box||!editing)return;const picked=new Set(editing.numbers);box.innerHTML=`<div class="mini-ticket"><p class="ticket-title edit-caption"><span>마킹 번호 수정</span><b>${editing.numbers.length} / 6</b></p><div class="ticket-grid">${Array.from({length:49},(_,i)=>{const n=i+1;return n<=45?`<button class="ticket-cell edit-cell ${picked.has(n)?'marked':''}" data-number="${n}" type="button">${n}</button>`:'<span class="ticket-cell blank"></span>'}).join('')}</div><button class="edit-save" data-index="${index}" type="button">수정 저장</button></div>`}function mine(){ $('#saved').innerHTML=saved.length?saved.map((s,i)=>`<div class="saved-row" data-i="${i}"><div class="saved-summary"><div><div class="saved-meta">내 조합 ${saved.length-i}${s.round?` · 제 ${s.round}회 예상`:''} · ${s.created} <span class="combo-type ${s.type==='ai'?'ai':''}">${s.type==='ai'?'AI 자동조합':'수동조합'}</span></div><div class="balls">${s.numbers.map(n=>`<span class="ball ${cls(n)}">${n}</span>`).join('')}</div></div><button class="delete" data-i="${i}">삭제</button></div><div class="my-details"></div></div>`).join(''):'<p class="subtitle">아직 저장한 조합이 없어요.</p>'}
function remote(x){if(!x||!Array.isArray(x.numbers)||!Array.isArray(x.divisions))throw Error();const r={회차:String(x.draw_no),추첨일:String(x.date).slice(0,10),보너스:String(x.bonus_no),총판매액:String(x.total_sales_amount||'')};x.numbers.forEach((n,i)=>r['번호'+(i+1)]=String(n));x.divisions.forEach((d,i)=>{const k=i+1;r[k+'등당첨자수']=String(d.winners||'');r[k+'등1인당당첨금']=String(d.prize||'')});return r}function load(){const m=new Map((window.LOTTO_DRAWS||[]).map(r=>[r.회차,r]));m.set('1237',{회차:'1237',추첨일:'2026-08-15',번호1:'10',번호2:'20',번호3:'23',번호4:'34',번호5:'37',번호6:'40',보너스:'36',총판매액:'','1등당첨자수':'23','1등1인당당첨금':'1214932680','2등당첨자수':'75','2등1인당당첨금':'62096560','3등당첨자수':'3745','3등1인당당첨금':'1243590','4등당첨자수':'172132','4등1인당당첨금':'50000','5등당첨자수':'2663409','5등1인당당첨금':'5000'});try{const r=JSON.parse(localStorage.getItem('lucky645-latest-draw'));if(r)m.set(r.회차,r)}catch(e){}draws=[...m.values()].sort((a,b)=>+a.회차-+b.회차);home();history();manual();mine();stores()}
document.addEventListener('click',e=>{const n=e.target.closest('.nav');if(n){document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x===n));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===n.dataset.view));if(n.dataset.view==='stores')stores();window.scrollTo(0,0);return}const d=e.target.closest('.delete');if(d){saved.splice(+d.dataset.i,1);localStorage.setItem('lucky645-saved',JSON.stringify(saved));mine();return}const h=e.target.closest('.history');if(h){h.classList.toggle('open');const b=h.querySelector('.history-compare');if(h.classList.contains('open')&&!b.dataset.ready){const r=draws.find(x=>String(x.회차)===h.dataset.round);b.innerHTML=table(matches([1,2,3,4,5,6].map(i=>r['번호'+i]),r.회차),'과거 회차 번호 일치 기록',`제 ${r.회차}회 번호를 이전 ${+r.회차-1}개 회차와 비교한 결과입니다.`,true);b.dataset.ready=1}return}const s=e.target.closest('.saved-row');if(s){s.classList.toggle('open');const b=s.querySelector('.my-details');if(s.classList.contains('open')&&!b.dataset.ready){const set=saved[+s.dataset.i],ms=matches(set.numbers);b.innerHTML=ticket(set.numbers)+table(ms,'역대 회차 번호 일치 기록',`이 조합의 6개 번호를 역대 ${draws.length}회 당첨번호와 비교한 결과입니다.`,false);b.dataset.ready=1}return}const p=e.target.closest('.pick');if(p&&p.dataset.no){const no=+p.dataset.no;selected.includes(no)?selected=selected.filter(x=>x!==no):selected.length<6&&selected.push(no);selected.sort((a,b)=>a-b);manual()}});$('#search').addEventListener('input',history);$('#save').addEventListener('click',()=>{if(selected.length!==6)return;saved.unshift({numbers:[...selected],created:new Date().toLocaleDateString('ko-KR'),round:draws.length?Number(draws[draws.length-1].회차)+1:null});localStorage.setItem('lucky645-saved',JSON.stringify(saved));selected=[];manual();mine();toast('내 조합에 저장했어요!')});$('#refresh').addEventListener('click',async()=>{const b=$('#refresh');b.disabled=true;b.textContent='업데이트 중…';try{const x=remote(await (await fetch('https://smok95.github.io/lotto/results/latest.json?t='+Date.now(),{cache:'no-store'})).json());localStorage.setItem('lucky645-latest-draw',JSON.stringify(x));const i=draws.findIndex(r=>r.회차===x.회차);i<0?draws.push(x):draws[i]=x;draws.sort((a,b)=>+a.회차-+b.회차);home();history();toast(`제 ${x.회차}회 최신 정보입니다.`)}catch(e){toast('업데이트에 실패했습니다.')}finally{b.disabled=false;b.textContent='↻ 업데이트'}});load();
</script><script>document.getElementById('auto').addEventListener('click',aiAutoPick);document.addEventListener('click',e=>{const card=e.target.closest('.history');if(card){e.preventDefault();e.stopImmediatePropagation();openDrawDetail(draws.find(r=>String(r.회차)===card.dataset.round))}},{capture:true});document.getElementById('drawBack').addEventListener('click',()=>{document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='history'));document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view==='history'));window.scrollTo(0,0)});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script><script src="supabase-sync.js"></script></body></html>
